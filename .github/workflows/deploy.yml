name: Deploy React App

on:
  push:
    branches:
      - main
      - shanshal

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and redeploy with Docker Compose
        run: |
          docker compose down
          docker compose build --no-cache
          docker compose up -d